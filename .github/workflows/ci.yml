name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установка зависимостей
        run: python -m pip install -e '.[dev]'
      - name: Тесты без Ollama
        run: python -m pytest
      - name: Сборка пакета
        run: python -m build
      - name: Проверка установленного пакета
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          localmind --help
          python -c "from rag_agent.main import app; from rag_agent.services.document_ingestion_service import DocumentIngestionService"
