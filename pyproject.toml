[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localmind"
version = "0.1.0"
description = "Local LLM agent for personal knowledge bases."
license = "MIT"
authors = [{name = "g1nry"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "langchain-core>=0.3,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph>=0.6,<2",
    "httpx",
]

[project.scripts]
localmind = "rag_agent.__main__:main"

[project.urls]
Repository = "https://github.com/g1nry/localmind"
Issues = "https://github.com/g1nry/localmind/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "build>=1.2,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
